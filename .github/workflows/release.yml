name: Release CLI

# A `v<x.y.z>` tag builds the Rust `jot` CLI for every platform and tests each
# build where it runs. With an NPM_TOKEN secret it then publishes the five
# platform packages and @usejot/cli (which pins them as optionalDependencies);
# without one the binaries stay as artifacts, published by hand.
#
# This repo (usejot/jot-cli) is exported from the Jot monorepo's packages/jot-cli:
#   node npm/version.mjs 0.2.0 && git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            exe: jot
          # macos-13 is retired; this is GitHub's Intel macOS runner
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            exe: jot
          # musl: one static binary that runs on any distro, whatever its glibc
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: jot
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: jot
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: jot.exe
    defaults:
      run:
        shell: bash
    env:
      # Windows: the C runtime linked in, so no Visual C++ redistributable is needed
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, crate and npm packages agree on the version
        run: node npm/version.mjs --check "${GITHUB_REF_NAME#v}"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: The binary runs
        run: ./target/${{ matrix.target }}/release/${{ matrix.exe }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance: a signed statement of which workflow built each package
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # npm only signs provenance for a public source repo; a private one publishes without it
      NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Each binary into its platform package
        run: |
          for dir in artifacts/cli-*; do
            platform="${dir#artifacts/}"
            mkdir -p "npm/$platform/bin"
            cp "$dir"/* "npm/$platform/bin/"
            chmod +x "npm/$platform/bin/"*
          done
          ls -l npm/cli-*/bin

      # the platform packages first: @usejot/cli pins each of them
      - name: Publish the platform packages
        run: |
          # no NPM_TOKEN secret: the builds stay as artifacts, published by hand
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping publish"; exit 0; fi
          for dir in npm/cli-*/; do
            (cd "$dir" && npm publish --access public)
          done

      - name: Publish @usejot/cli
        working-directory: npm/cli
        run: |
          # no NPM_TOKEN secret: the builds stay as artifacts, published by hand
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping publish"; exit 0; fi
          npm publish --access public
