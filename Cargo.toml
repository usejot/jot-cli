[package]
name = "jot-cli"
version = "0.1.2"
edition = "2021"
description = "jot: your Jot feedback, in the terminal and in your coding agent"
license = "MIT"
repository = "https://github.com/usejot/jot-cli"
publish = false

[[bin]]
name = "jot"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
